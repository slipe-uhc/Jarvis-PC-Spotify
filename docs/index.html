<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jarvis</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--tx:#f2f2f2;--mut:#8a8a8a;--ac:#fff;--ac2:#cfcfcf;--gl:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);--ok:#e8e8e8;--warn:#d6d6d6;--bad:#9a9a9a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0)) 0 max(14px,env(safe-area-inset-left,0))}
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orbs i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orbs i:nth-child(1){width:420px;height:420px;background:#fff;right:-140px;top:-160px;opacity:.10;animation:fl1 26s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:380px;height:380px;background:#bbb;left:-180px;top:40%;opacity:.07;animation:fl2 32s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:340px;height:340px;background:#fff;right:-120px;bottom:-140px;opacity:.06;animation:fl1 36s ease-in-out infinite alternate-reverse}
@keyframes fl1{to{transform:translate(-60px,70px) scale(1.15)}}
@keyframes fl2{to{transform:translate(90px,-50px) scale(1.1)}}

#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:12px 0 110px}
header{position:sticky;top:max(6px,env(safe-area-inset-top,0));z-index:30;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:rgba(8,8,8,.9);border:1px solid var(--bd);border-radius:18px;padding:10px 16px;backdrop-filter:blur(30px) saturate(120%);-webkit-backdrop-filter:blur(30px) saturate(120%)}
.brand{font:500 11px ui-monospace,"JetBrains Mono",Consolas,monospace;letter-spacing:.3em;color:var(--mut)}
.date{font-size:17px;font-weight:600;margin-top:2px;letter-spacing:-.01em}.date::first-letter{text-transform:uppercase}
.lv{text-align:right;min-width:120px}.lv b{font-size:13px;color:var(--ac)}
.bar{height:3px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .4s}
.small{font-size:12px;color:var(--mut)}
.modes{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;background:#fff;border:1px solid #fff;color:#000;text-decoration:none;font-size:14px;font-weight:500;transition:.15s}
.mode{padding:6px 12px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-size:13px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.mode.on{border-color:#fff;color:#000;background:#fff}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0)) calc(6px + env(safe-area-inset-bottom,0)) max(8px,env(safe-area-inset-left,0));background:rgba(8,8,8,.6);border-top:1px solid var(--bd);backdrop-filter:blur(34px) saturate(120%);-webkit-backdrop-filter:blur(34px) saturate(120%)}
nav#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--mut);font-size:11px;border-radius:12px}
nav#tabs button.on{color:#fff;background:rgba(255,255,255,.09)}
.card{background:rgba(255,255,255,.045);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;backdrop-filter:blur(30px) saturate(120%);-webkit-backdrop-filter:blur(30px) saturate(120%);animation:rise .35s both}
.card h3{margin:0 0 12px;font:500 11px ui-monospace,"JetBrains Mono",Consolas,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero .big{font-size:22px;font-weight:600;letter-spacing:-.02em}
.wat{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--bd);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.wat .wi{color:#fff}.wat .wb{flex:1;min-width:0}.wat .wb b{font-size:14px}
.wat .bar{height:6px;margin-top:5px}
.wat button{width:36px;height:36px;border-radius:12px;background:#fff;border:0;color:#000;font-size:20px;line-height:1}
.wat button.m{width:30px;height:30px;font-size:16px;background:var(--gl);border-color:var(--bd);color:var(--mut)}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-radius:12px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .2s}
.row+.row{border-top:1px solid rgba(255,255,255,.06)}
.row:hover{background:rgba(255,255,255,.04)}
.row.cur{background:rgba(255,255,255,.07);outline:1px solid rgba(255,255,255,.2)}
.row.dn .tt{opacity:.45;text-decoration:line-through}
.ck{flex:none;width:34px;height:34px;margin:-6px -4px -6px -6px;background:none;border:0;display:grid;place-items:center;padding:0}
.ck span{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center;color:#000;transition:.2s}
.dn .ck span{background:#fff;border-color:#fff}
.ck svg{width:14px;height:14px;stroke-width:3}
.tm{flex:none;width:44px;color:var(--mut);font:13px ui-monospace,"JetBrains Mono",Consolas,monospace;padding-top:2px}
.tb{min-width:0;flex:1}
.tt{font-weight:500}
.dt{font-size:13px;color:var(--mut)}
.chev{flex:none;color:var(--mut);transition:.2s;margin-top:2px}
.row.open .chev{transform:rotate(180deg)}
.xp{display:none;margin-top:8px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:default;user-select:text;-webkit-user-select:text}
.row.open .xp{display:block}
.xp .mt{font-size:13px;color:var(--tx);white-space:pre-wrap;margin-top:6px}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.seg{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:7px 8px;border-radius:10px;background:var(--gl);border:1px solid var(--bd);font-size:12px;color:var(--mut)}
.seg button.on{background:#fff;border-color:#fff;color:#000}
.miss{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.miss.ok{color:var(--mut);text-decoration:line-through}

.btn.ghost{background:rgba(255,255,255,.06);border-color:var(--bd);color:var(--tx);font-weight:400}
.btn.red{color:#bbb;border-color:rgba(255,255,255,.2);background:transparent;font-weight:400}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn:active,.chip:active,.mode:active{transform:scale(.96)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ex .exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .exh span{color:var(--mut);font-size:13px;white-space:nowrap}
.inp{display:flex;gap:10px;margin:10px 0}
.inp label{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
input,textarea,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
.inp input{width:74px}
textarea{width:100%;min-height:150px;font-size:13px}
input[type=range]{padding:0;width:100%;accent-color:#fff;background:none;border:0}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:42px;height:42px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);font:15px ui-monospace,Consolas,monospace}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.rest{position:sticky;top:76px;z-index:5;display:none;justify-content:space-between;align-items:center;background:rgba(12,12,12,.75);border:1px solid #fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.rest b{font:22px ui-monospace,Consolas,monospace;color:#fff}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.pill{flex:none;min-width:58px;padding:8px 6px;border-radius:12px;background:var(--gl);border:1px solid var(--bd);text-align:center;font-size:12px}
.pill.on{border-color:#fff;color:#000;background:#fff}.pill.on .pc{color:#333}
.pill .pc{font-size:11px;color:var(--mut)}
.mic{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;font-size:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.35);color:#fff}
.mic.on{background:#fff;color:#000;font-weight:600;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.b{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-wrap:break-word;animation:rise .2s both}
.b.me{align-self:flex-end;background:#fff;color:#000;border:1px solid #fff}
.b.ja{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--bd)}
.b.sys{align-self:center;font-size:12px;color:var(--mut);background:none}
.typing{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chips button{flex:none;padding:6px 10px;border-radius:99px;background:var(--gl);border:1px solid var(--bd);font-size:12px;color:var(--mut)}
form.cmd{display:flex;gap:8px;margin-top:8px}
form.cmd input{flex:1;min-width:0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.tg{flex:none;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid var(--bd);position:relative}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:.2s}
.tg.on{background:#fff;border-color:#fff}
.tg.on::after{left:22px;background:#000}
ul.l{margin:6px 0;padding-left:18px;color:var(--mut);font-size:13px}
ul.l li{margin:3px 0}
code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px;font-size:12px}
.dg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.06)}
.dg:first-of-type{border-top:0}
.ok{color:#fff}.no{color:#8a8a8a}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.gh b{font-size:16px}
.gb{display:none;margin-top:10px}
.gc.open .gb{display:block}
.gc.open .chev{transform:rotate(180deg)}
.gb h4{margin:14px 0 4px;font:500 11px ui-monospace,Consolas,monospace;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.gb p{margin:4px 0;font-size:14px;white-space:pre-wrap}
.gb ul{margin:4px 0;padding-left:18px;font-size:14px;color:var(--tx)}
.gb li{margin:3px 0}
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.on{display:block}
.sbg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(8px)}
.sbox{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;height:78vh;display:flex;flex-direction:column;padding:14px 14px calc(12px + env(safe-area-inset-bottom,0));border-radius:22px 22px 0 0;background:rgba(10,10,10,.72);border:1px solid var(--bd);backdrop-filter:blur(40px) saturate(120%);-webkit-backdrop-filter:blur(40px) saturate(120%);box-shadow:0 -10px 50px rgba(0,0,0,.6);animation:up .25s both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sh b{font-size:15px}.sh .small{display:block}
.sbox .chat{flex:1;max-height:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0));transform:translateX(-50%) translateY(30px);opacity:0;transition:.3s;background:rgba(18,18,18,.92);border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:10px 16px;max-width:90vw;font-size:14px;z-index:70;pointer-events:none;backdrop-filter:blur(14px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){.orbs i,.card,.b{animation:none}}
@media(min-width:900px){
  #app{max-width:1120px;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto auto 1fr;column-gap:18px;align-items:start;padding-bottom:40px}
  header{grid-column:1/-1}
  #modes{grid-column:1;flex-direction:column;margin:14px 0 6px}
  #modes .mode{text-align:left;border-radius:12px}
  nav#tabs{position:static;grid-column:1;flex-direction:column;justify-content:flex-start;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;gap:4px}
  nav#tabs button{flex-direction:row;gap:10px;justify-content:flex-start;padding:12px 14px;font-size:15px;border:1px solid transparent}
  nav#tabs button.on{border-color:var(--bd)}
  #view{grid-column:2;grid-row:2/span 2;margin-top:14px}
  #toast{bottom:24px}
  .sbox{height:72vh;border-radius:22px;bottom:4vh}
  .rest{top:84px}
}

.wat button.bt{width:auto;padding:0 12px;font-size:13px;font-weight:600}
.btn.sm{padding:6px 11px;font-size:13px}
</style>
</head>

<script>
'use strict';
var NATIVE=window.Android||null;

/* ========= utilidades ========= */

function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)}
function pad(n){return String(n).padStart(2,'0')}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayIdx(d){d=d||new Date();return (d.getDay()+6)%7}
function mm(t){var p=t.split(':');return (+p[0])*60+(+p[1]||0)}
function nowT(){var n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())}
function cmpT(a,b){return a.t<b.t?-1:a.t>b.t?1:0}
var IC={
 check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

 play:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',

 chat:'<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 today:'<svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 gym:'<svg class="i" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>',
 week:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
 book:'<svg class="i" viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h10"/></svg>',
 jarvis:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
 gear:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>'
};

/* ========= rotina padrão ========= */
function mk(di,line){
  var p=line.split('|'),fl=(p[3]||'').split(',').filter(Boolean);
  var o={t:p[0],title:p[1],d:p[2]||'',imp:false,snd:false,w:'',c:'',u:''};
  fl.forEach(function(f){if(f==='i')o.imp=true;else if(f==='s')o.snd=true;else if(f.indexOf('w=')===0)o.w=f.slice(2);else if(f.indexOf('c=')===0)o.c=f.slice(2);else if(f.indexOf('u=')===0)o.u=f.slice(2)});
  if(o.w){o.imp=true;o.snd=true;o.c='train'}
  o.id='d'+di+'_'+p[0].replace(':','')+'_'+slug(p[1]);
  return o;
}
var AM=["05:30|Acordar e escovar os dentes|Luz fraca, sem barulho|c=rest","05:35|Anki 10 min|Fone, volume baixo|c=en","05:45|Shadowing 5 min|Sussurrando|c=en","05:50|Café da manhã|Opção A ou B|i,c=food","06:10|Rosto + protetor solar|Lavar, hidratar, protetor|c=skin"];
var LANCHE="09:30|Lanche da escola|Opção A ou B|c=food";
var ALM="12:30|Almoço|Arroz, feijão, proteína, salada|i,c=food";
var LAN2="16:00|Lanche da tarde|Opção A ou B|c=food";
var PRE="17:30|Pré-treino|Banana + pão com mel (ou batata)|c=food";
var ESC="06:20|Sair para a escola|Fone, mochila, garrafa|c=rest";
function JANTA(t,d){return t+"|Janta|"+(d||"Prato cheio com proteína")+"|i,c=food"}
function ING(t,d){return t+"|Inglês da noite|"+(d||"Diário (3 frases) + áudio 5 min")+"|i,c=en"}
function CEIA(t){return t+"|Ceia|Leite ou iogurte + algo leve|c=food"}
function SKIN(t){return t+"|Rosto da noite|Lavar, hidratante, lábios|c=skin"}
function PREP(t){return t+"|Preparar o amanhã sem barulho|Mochila, roupa, garrafa|c=rest"}
function SLEEP(t){return t+"|Dormir|Celular longe, luz apagada|i,s,c=sleep"}
function ABS(t){return t+"|Abdômen + jawline (20 min)|Prancha, elevação de pernas, mewing|c=train"}
function POST(t){return t+"|Postura|Alongar peitoral 3×30s + queixo pra trás 2×15|c=train"}

function parseText(txt){
  var days=[[],[],[],[],[],[],[]],ex={},cur=-1,lastT='08:00',all=[],n=0,wkd={};
  var hr=/^(segunda|terca|quarta|quinta|sexta|sabado|domingo|seg|ter|qua|qui|sex|sab|dom)\b/;
  var idxOf={segunda:0,seg:0,terca:1,ter:1,quarta:2,qua:2,quinta:3,qui:3,sexta:4,sex:4,sabado:5,sab:5,domingo:6,dom:6};
  txt.split(/\r?\n/).forEach(function(raw){
    var line=raw.replace(/^\s*(?:[#>*\-+]+\s*)*(?:\[[ xX]\]\s*)?/,'').replace(/\*\*/g,'').trim();
    if(!line)return;
    var nl=norm(line).replace(/[:\-–—\s]+$/,'').trim();
    var tm=line.match(/^(\d{1,2})(?::|h)(\d{2})?\s*(?:[-–a]\s*\d{1,2}(?::|h)?\d{0,2})?\s*[-–—:]?\s*(.*)$/);
    if(!tm){
      if(/^(todos os dias|todo dia|diario|diaria)\b/.test(nl)&&nl.length<30){cur=-2;return}
      var h=nl.match(hr);if(h&&nl.length<45&&!/\d\s*[x×]\s*\d/.test(nl)){cur=idxOf[h[1]];return}
    }
    if(cur===-1)return;
    var title=line,t=null;
    if(tm){t=pad(Math.min(23,+tm[1]))+':'+pad(+(tm[2]||0));title=tm[3].trim()||'Item';lastT=t}
    var detail='',sp=title.split(/\s+[—–-]\s+/);
    var exm=title.match(/^(.*?)\s*[-–—:]?\s*(\d+)\s*[x×]\s*(\d+(?:\s*[-–a]\s*\d+)?|falha|m[aá]x\w*)/i);
    var targets=cur===-2?[0,1,2,3,4,5,6]:[cur];
    if(exm&&exm[1].trim().length>1){
      targets.forEach(function(di){var key='imp_'+di;(ex[key]=ex[key]||{name:'Treino de '+DN[di],t:t||lastT,list:[]}).list.push({n:exm[1].trim().replace(/[-–—:]+$/,'').trim(),s:+exm[2],r:exm[3].replace(/\s+/g,'')});if(t)ex[key].t=ex[key].t||t});
      n++;return}
    if(sp.length>1){title=sp[0];detail=sp.slice(1).join(' — ')}
    targets.forEach(function(di){days[di].push({id:'x'+di+'_'+lastT.replace(':','')+'_'+slug(title),t:t||lastT,title:title,d:detail,imp:/!|\*$/.test(raw)||/treino|dormir|acordar|almo[cç]o|janta|estud|ingl/i.test(title),snd:/treino|dormir|acordar/i.test(title),w:'',c:/ingl/i.test(title)?'en':/estud|aula|prova/i.test(title)?'study':/treino/i.test(title)?'train':'',u:''})});
    n++;
  });
  Object.keys(ex).forEach(function(key){
    var di=+key.split('_')[1],wid='imp'+di;
    wkd[wid]={name:ex[key].name,ex:ex[key].list};
    var ex0=days[di].find(function(i){return /^treino/i.test(i.title)&&!i.w});
    if(ex0){ex0.w=wid;ex0.imp=true;ex0.snd=true;ex0.c='train';if(!ex0.d)ex0.d=ex[key].list.length+' exercícios'}
    else days[di].push({id:'x'+di+'_'+ex[key].t.replace(':','')+'_treino',t:ex[key].t,title:'Treino',d:ex[key].list.length+' exercícios',imp:true,snd:true,w:wid,c:'train',u:''});
  });
  days.forEach(function(a){a.sort(cmpT)});
  return {days:days,wk:wkd,count:n}}
function importText(txt,name){
  txt=String(txt||'').trim();name=(name||'').trim()||'Rotina importada';var r;
  if(!txt){toast('Cole a rotina primeiro');return false}

    if(txt[0]==='{'){var j=JSON.parse(txt);
      if(j.rs&&j.done){ /* backup completo */
        var keep=S.ai;S=Object.assign(S,j);S.ai=keep;save();render();toast('Backup restaurado');return true}

    else{var p=parseText(txt);if(!p.count){toast('Não achei itens. Use títulos de dia (Segunda, Terça…) e horários como 06:30');return false}r={id:'c'+Date.now(),name:name,days:p.days,wk:p.wk}}

      case 'open_app':openApp(a.name||'',a.url||'');break;
      case 'open_url':openUrl(a.url||'');break;

      case 'spotify':openSpotify(a.q||'');break;
      case 'search':openUrl('https://www.google.com/search?q='+encodeURIComponent(a.q||''));break;
      case 'mode':if(MODES.indexOf(a.v)>=0)setMode(a.v);break;
      case 'tab':if(TABS.some(function(t){return t[0]===a.v})){closeSheet();S.tab=a.v;save();render()}break;
      case 'done':{var id=a.id;if(!id){var c=curNext(),it=c.cur||c.next;id=it&&it.id}if(id&&!doneToday()[id])toggle(id);break}
      case 'snooze':{var id2=a.id;if(!id2){var c2=curNext(),i2=c2.cur||c2.next;id2=i2&&i2.id}if(id2)snoozeItem(id2,+a.min||30);break}
      case 'skip_item':if(a.id)skipItem(a.id);break;
      case 'add_item':addItem(a);break;
      case 'sub':if(a.id&&SUBS.some(function(s){return s[0]===a.v})){S.sub[a.id]=a.v;save();render()}break;
      case 'water':addWater(+a.n||1);break;

  var n=0;chunks.forEach(function(c){n+=c.length});var all=new Float32Array(n),o=0;chunks.forEach(function(c){all.set(c,o);o+=c.length});
  var r=16000,ratio=rate/r,len=Math.floor(n/ratio),buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  function w(off,str){for(var i=0;i<str.length;i++)v.setUint8(off+i,str.charCodeAt(i))}
  w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,r,true);v.setUint32(28,r*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);
  for(var i=0;i<len;i++){var a=Math.floor(i*ratio),b=Math.max(a+1,Math.floor((i+1)*ratio)),sum=0;for(var k=a;k<b&&k<n;k++)sum+=all[k];var x=Math.max(-1,Math.min(1,sum/(b-a)));v.setInt16(44+i*2,x<0?x*0x8000:x*0x7FFF,true)}
  return new Blob([buf],{type:'audio/wav'})}
function whSend(chunks,rate,voicedMs){
  if(voicedMs<300||WH.busy>2)return;
  var key=groqKey();if(!key)return;
  var fd=new FormData();fd.append('file',wavFrom(chunks,rate),'a.wav');fd.append('model','whisper-large-v3-turbo');fd.append('language','pt');fd.append('response_format','json');fd.append('temperature','0');
  WH.busy++;

    WH.busy--;
    if(x.ok){var t=String(x.j.text||'').trim();if(t.length>1){toast('Ouvi: '+t.slice(0,60));heard(t)}}
    else{var m=(x.j.error&&x.j.error.message)||('HTTP '+x.s);toast(x.s===429?'Groq: limite de voz, espere um pouco':'Groq voz: '+String(m).slice(0,80))}

function whStart(){
  if(WH.on)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Sem acesso ao microfone neste app.');return}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}}).then(function(stream){
    var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();try{ctx.resume()}catch(e){}
    WH.stream=stream;WH.ctx=ctx;WH.on=true;WH.buf=[];WH.pre=[];WH.talking=false;
    var src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1);
    proc.onaudioprocess=function(e){
      if(!WH.on)return;
      var c=new Float32Array(e.inputBuffer.getChannelData(0)),sum=0;for(var i=0;i<c.length;i++)sum+=c[i]*c[i];
      var rms=Math.sqrt(sum/c.length),now=Date.now();
      if(isSpeakingNow()){WH.talking=false;WH.buf=[];WH.pre=[];return}
      var thr=Math.max(0.018,WH.floor*3.2);
      if(!WH.talking){
        WH.floor=WH.floor*0.97+rms*0.03;
        WH.pre.push(c);if(WH.pre.length>3)WH.pre.shift();
        if(rms>thr){WH.talking=true;WH.start=now;WH.lastVoice=now;WH.buf=WH.pre.slice();WH.pre=[]}
      }else{
        WH.buf.push(c);if(rms>thr*0.7)WH.lastVoice=now;
        if(now-WH.lastVoice>900||now-WH.start>12000){WH.talking=false;var b=WH.buf;WH.buf=[];whSend(b,ctx.sampleRate,WH.lastVoice-WH.start)}
      }};
    src.connect(proc);proc.connect(ctx.destination);WH.proc=proc;
    toast('Escutando com Groq Whisper')
  }).catch(function(e){WH.on=false;toast('Sem acesso ao microfone ('+((e&&e.name)||'erro')+'). Veja Privacidade > Microfone no Windows.');S.voice=false;save();render()})}
function whStop(){
  WH.on=false;WH.talking=false;WH.buf=[];WH.pre=[];
  try{if(WH.proc){WH.proc.onaudioprocess=null;WH.proc.disconnect()}}catch(e){}
  try{if(WH.stream)WH.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  try{if(WH.ctx)WH.ctx.close()}catch(e){}
  WH.proc=null;WH.stream=null;WH.ctx=null}
